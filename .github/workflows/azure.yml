# Pruebas en cada pull request a main y publicación en Azure App Service (WebAppLuciaPeluqueria) al fusionar en main.
# A main solo llega código por pull request con «Compilar y probar» en verde (ruleset «Proteger main», sin excepciones),
# así que al fusionar no se repiten las pruebas: se publica main tal cual y se comprueba la Web App de producción en
# /salud, que responde 200 solo si llega a Azure SQL y la base tiene todas las migraciones del código.
# Lanzado a mano (Run workflow) sobre main, primero prueba y después publica.
# La publicación entra en Azure con una identidad federada (OIDC): GitHub no guarda ninguna contraseña.
# Las migraciones de la base NO se aplican aquí: se aplican a mano antes de publicar (ver docs/AZURE.md). Si faltan,
# /salud lo dice y el despliegue falla.
name: Pruebas y despliegue en Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pruebas:
    name: Compilar y probar
    # En un push a main no se repiten: ese mismo código ya las pasó en su pull request
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # SQL Server de usar y tirar para las pruebas de integración (cada prueba crea y borra su propia base)
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Pruebas_GitHub_2026!
          MSSQL_COLLATION: Modern_Spanish_CI_AS
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Pruebas_GitHub_2026!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      PELUQUERIA_PRUEBAS_SQL: Server=localhost,1433;User Id=sa;Password=Pruebas_GitHub_2026!;TrustServerCertificate=True;Encrypt=False
      # Solo aquí: en Linux sin Key Vault las claves de prueba se guardan sin cifrar en bases que se borran al acabar
      ProteccionDatos__PermitirSinCifrar: "true"
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Los paquetes NuGet solo se descargan de nuevo cuando cambia algún proyecto
      - name: Paquetes NuGet en caché
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restaurar
        run: dotnet restore PeluqueriaLucia.sln
      - name: Compilar
        run: dotnet build PeluqueriaLucia.sln -c Release --no-restore
      - name: Pruebas .NET
        run: dotnet test PeluqueriaLucia.sln -c Release --no-build --logger "trx;LogFileName=resultados.trx"
      - name: Pruebas JavaScript
        run: node --test tests/PeluqueriaLucia.Tests/Web/*.test.cjs
      - name: Guardar resultados
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-pruebas
          path: "**/resultados.trx"

  desplegar:
    name: Publicar en Azure
    needs: pruebas
    # Tras un push a main, «pruebas» se salta y se publica directamente; lanzado a mano, solo si las pruebas pasan
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && (needs.pruebas.result == 'success' || needs.pruebas.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Entorno de GitHub «produccion»: la identidad federada de Azure solo confía en este entorno
    environment:
      name: produccion
      url: https://luciapeluqueriaecologica.com
    permissions:
      contents: read
      id-token: write
    env:
      ORIGEN: https://webappluciapeluqueria-a9dycjgph4f0etaz.spaincentral-01.azurewebsites.net
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Paquetes NuGet en caché
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publicar para Linux
        run: dotnet publish src/PeluqueriaLucia.Web -c Release -r linux-x64 --self-contained false -o publicacion
      - name: Entrar en Azure (OIDC, sin contraseñas)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Desplegar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: WebAppLuciaPeluqueria
          package: publicacion
      # Cloudflare desafía a las IP de centros de datos (como la de este runner) y devuelve 403, y la Web App solo
      # admite tráfico de Cloudflare. Para comprobar el origen se abre paso a la IP del runner solo durante este job.
      - name: Abrir paso a este runner en la Web App
        id: paso
        run: |
          ip=$(curl -s https://api.ipify.org)
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          az webapp config access-restriction add -g rg-lucia-prod -n WebAppLuciaPeluqueria \
            --rule-name "github-${{ github.run_id }}" --action Allow --priority 50 --ip-address "$ip/32" -o none
      # Mientras arranca, App Service retiene la petición o responde 502/503 con su propia página: se reintenta cada
      # 5 s hasta 6 minutos. Si es la aplicación la que dice que faltan migraciones, se para enseguida.
      - name: Comprobar producción (base de datos y migraciones)
        run: |
          fin=$((SECONDS + 360))
          while [ "$SECONDS" -lt "$fin" ]; do
            respuesta=$(curl -s --max-time 90 -w $'\n%{http_code}' "$ORIGEN/salud" || true)
            codigo=${respuesta##*$'\n'}
            cuerpo=${respuesta%$'\n'*}
            echo "HTTP $codigo ${cuerpo:0:120}"
            [ "$codigo" = "200" ] && exit 0
            case "$cuerpo" in
              *"migraci"*) echo "::error::$cuerpo. Aplica las migraciones pendientes (docs/AZURE.md) y vuelve a lanzar el despliegue."; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Producción no responde bien en $ORIGEN/salud tras el despliegue: ${cuerpo:0:200}"
          exit 1
      - name: Cerrar el paso al runner
        if: always() && steps.paso.outcome == 'success'
        run: az webapp config access-restriction remove -g rg-lucia-prod -n WebAppLuciaPeluqueria --rule-name "github-${{ github.run_id }}" -o none
      - name: Comprobar por Cloudflare (informativo)
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (compatible; despliegue-lucia)" https://luciapeluqueriaecologica.com/)
          echo "Por Cloudflare: HTTP $codigo (un 403 aquí es el desafío de Cloudflare a la IP del runner, no un fallo de la web)"
